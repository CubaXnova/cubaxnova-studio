# OPCIONAL: solo si quieres entrar por un dominio con HTTPS en vez de por túnel SSH.
# Crea un archivo NUEVO (no edites los de tus otros proyectos), p. ej.
#   /etc/nginx/sites-available/studio.conf  ->  ln -s ... /etc/nginx/sites-enabled/
# Luego: sudo nginx -t && sudo systemctl reload nginx   y   sudo certbot --nginx -d studio.tudominio.com
server {
    listen 80;
    server_name studio.tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
